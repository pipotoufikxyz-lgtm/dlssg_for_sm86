; Optional. Copy beside the game executable (the folder that receives
; nvsmooth30.log) and rename to nvsmooth30.ini. Restart the game after edits.
[RTX20]
; auto: half-resolution optical flow when the real frame rate is 58 FPS or
;       more (back to full below 45 FPS); full resolution otherwise.
; full: always full resolution (best thin detail, highest GPU cost).
; half: always half resolution (lowest GPU cost, 8-pixel flow cells).
FlowResolution=auto

; How generated frames are presented. Both frames of a pair come from the
; game's own Present; each is now shown for half a real-frame interval.
; auto:        timed if that fits without lowering the game's frame rate,
;              otherwise pipelined (Fix14 default).
; low_latency: timed only: generated frame, then the real frame half an
;              interval later; the wait shrinks if it would slow the game.
; smooth:      pipelined only: the previous pair is shown with even spacing
;              while the next pair is computed; one real frame more latency.
; vblank:      Fix13 behaviour: both frames with VSync on consecutive
;              refreshes (game held at half the refresh rate).
; off:         both frames immediately (Fix12: uneven, generated frame is
;              barely visible).
; Games that present with VSync always use consecutive refreshes.
Pacing=auto

; Optical-flow quality at full resolution.
; auto:   NVIDIA's SLOW (best quality) preset below 55 real FPS (Fix14-26:
;         40), MEDIUM above,
;         in both cases only while the measured cost fits GpuBudget (Fix15).
; high:   always SLOW (longer flow time; ignores GpuBudget).
; medium: always MEDIUM (Fix13 behaviour).
FlowQuality=auto

; Fix15. GPU time frame generation may use, in percent of each real frame's
; time. Automatic flow settings pick the best mode whose measured cost
; (optical flow + synthesis per pair) fits: SLOW, then MEDIUM, then half
; resolution. Costs are re-measured every 30 seconds.
; Fix26: half resolution is chosen for the budget only when it was measured
; clearly cheaper than MEDIUM (its 8-pixel cells break hilts, hair and HUD
; text into fragments at low frame rates).
; auto: 20 (e.g. 6.7 ms per pair at a 30 FPS base; Fix15-25: 10).
; 0 or off: no limit (Fix14 behaviour: SLOW below 40 FPS).
GpuBudget=auto

; Fix15. 1: interpolate exclusive-fullscreen games too. 0: pass exclusive
; fullscreen through untouched (Fix14 behaviour).
ExclusiveFullscreen=1

; Fix20. Percent of the game's own (native) frame rate the real rate must keep
; while generating; below it, generation pauses (e.g. 70 native -> 35 real +
; 35 generated only looks like 70 with more latency). auto: 65. 0/off: no
; floor (Fix17-19 behaviour: only the displayed rate is checked).
MinimumBaseRate=auto

; 0: stop generating while the real frame rate is at or above the display
;    refresh rate (extra frames could not be shown anyway).
; 1: always generate.
GenerateAboveRefresh=0

; Fix23. 1: if no game swapchain was seen 4 s after dxgi.dll loaded (games
; whose device creation the hooks cannot intercept), a hidden 64x64 probe
; swapchain finds DXGI's swapchain tables so the game's Presents are hooked.
; 0: off (only the intercepted creation calls are used).
PresentTableProbe=1

; Fix25. 1: optical flow runs on a private D3D11 device and worker thread,
; ordered on the GPU by shared fences, so the game's Present thread no
; longer waits for it (it waited ~8 ms per pair in God of War). Falls back
; to the Fix24 path automatically if the driver cannot share fences.
; 0: Fix24 behaviour (flow on the Present thread).
AsyncFlow=1

; Fix25. 1: compiled shaders are kept in
; %LOCALAPPDATA%\SmoothMotion\ShaderCache; only the first start of a new
; version compiles them (10-45 s of pass-through). 0: compile every start.
ShaderCache=1
