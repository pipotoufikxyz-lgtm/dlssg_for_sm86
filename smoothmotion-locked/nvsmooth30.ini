; SmoothMotion fix28-qua2-lock. Copy beside the game executable (the folder
; that receives nvsmooth30.log). Restart the game after edits.
[RTX20]
; locked (default): always 2x. Every real frame is followed by exactly one
;   generated frame, each shown for the same number of display refreshes
;   (VSync pairs). Never paused, no native/measuring phases, no cost guard,
;   generated frames are never dropped for a busy queue, and the optical-flow
;   mode never switches during the session. The game is held at half the
;   refresh rate (e.g. 72 real / 144 shown on a 144 Hz display).
; auto: Fix28 behaviour (CPU-timed spacing, may pause generation).
; vblank / smooth / low_latency / off: as in Fix28.
Pacing=locked

; Pacing=locked only (DXGI games).
; half (default): game at refresh/2, every shown frame lasts one refresh.
; quarter: game at refresh/4, every shown frame lasts two refreshes. Use it
;   when the game cannot hold half the refresh with generation on (the log's
;   locked_late_frames keeps rising): a missed refresh is a visible stutter,
;   quarter avoids it at a lower displayed rate.
; Vulkan games always use half (FIFO has no per-present interval).
LockedBaseRate=half

; With Pacing=locked, auto means full resolution / MEDIUM, fixed for the
; session. half halves the optical-flow cost (8-pixel cells, thin detail
; suffers); high (SLOW) costs the most.
FlowResolution=auto
FlowQuality=auto

; Not used with Pacing=locked (no automatic flow switching, no guard).
GpuBudget=auto
MinimumBaseRate=auto
GenerateAboveRefresh=0

ExclusiveFullscreen=1
PresentTableProbe=1
AsyncFlow=1
ShaderCache=1
FlowRefine=1
; Vulkan games: with Pacing=locked, generating swapchains are created with
; FIFO (VSync) whatever the game asked for.
Vulkan=1
